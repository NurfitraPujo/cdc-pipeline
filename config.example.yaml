# CDC Data Pipeline - Configuration Template
# This file serves as a reference for the settings stored in NATS KV.

# Authentication (Stored in NATS KV as 'cdc.config.auth')
auth:
  username: "admin"
  password: "admin"

# Global Defaults (Stored in NATS KV as 'cdc.config.global')
global:
  batch_size: 1000
  batch_wait: 5s

# Source Configurations (Stored in NATS KV as 'cdc.config.sources.{id}')
sources:
  - id: "postgres-primary"
    type: "postgres"
    host: "localhost"
    port: 5432
    user: "cdc_user"
    pass: "your-encrypted-password"
    database: "production_db"
    slot_name: "cdc_slot"
    publication_name: "cdc_pub"
    # Schema whitelist. Tables are discovered only in these schemas.
    # Empty or omitted means "public only" -- NOT all schemas. Discovering
    # every schema by default would silently start replicating unrelated
    # tables on upgrade, so the whitelist is opt-in.
    schemas:
      - "public"
      - "sales"
    batch_size: 100

# Sink Configurations (Stored in NATS KV as 'cdc.config.sinks.{id}')
# Each sink gets its own consumer with independent NATS subscription and checkpoint tracking
sinks:
  - id: "databend-analytics"
    type: "databend"
    dsn: "http://root:@localhost:8000"
    # A Postgres schema maps to a Databend DATABASE (Databend has no schema
    # layer), so public.orders is written to the "public" database, NOT to
    # the database the DSN selects.
    # options:
    #   auto_create_schema: true   # default true; issues CREATE DATABASE IF
    #                              # NOT EXISTS for each target database.
    #                              # When false, the pipeline validates every
    #                              # target at startup and refuses to start
    #                              # if one is missing.
  
  - id: "postgres-debug"
    type: "postgres_debug"
    dsn: "postgres://cdc_user:password@localhost:5432/debug_db"
    # Options can include:
    #   retention:
    #     mode: "age"
    #     max_age: "168h"  # 7 days in hours
    #   filters:
    #     include_tables: ["orders", "users"]
    #   sampling:
    #     mode: "percentage"
    #     value: 10  # capture 10% of rows

# Pipeline Configurations (Stored in NATS KV as 'cdc.config.pipelines.{id}')
# Supports multiple sinks - each sink runs in its own consumer goroutine
pipelines:
  - id: "pipe-01"
    name: "Main Data Sync with Debug"
    sources: ["postgres-primary"]
    sinks: ["databend-analytics", "postgres-debug"]
    tables:
      - "users"
      - "orders"
      - "products"
    
    # Optional Overrides (If not set, global defaults are used)
    batch_size: 2000
    batch_wait: 10s

    # processors:
    #   - type: "nats/protobuf"
    #     options:
    #       nats_url: "nats://localhost:4222"
    #       subject: "daya.transform.custom_objects"
    #       # WS-1B: this processor must transform two different replication
    #       # classes -- every custom_objects.* table (generated custom
    #       # tables and built-in sidecars) AND the public.visitations table
    #       # specifically (enriched with checked_in/checked_out; every
    #       # other public built-in, e.g. master_contacts, business_entities,
    #       # is left untransformed by not appearing in either list below).
    #       # `schemas` and `tables` OR together when both are set -- a
    #       # message matches if it satisfies either, not both -- so this
    #       # combination is exactly "custom_objects schema, plus
    #       # visitations regardless of schema". Configuring only one of the
    #       # two still behaves as a single filter, unchanged.
    #       schemas: ["custom_objects"]
    #       tables: ["visitations"]
