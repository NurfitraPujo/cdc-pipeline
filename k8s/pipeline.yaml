apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline
spec:
  # The worker is a stateful singleton per pipeline (see RFC-001 "Scaling").
  # Each replica starts a producer for every pipeline it sees in the config KV,
  # so >1 replica collides on the Postgres replication slot (internal/engine/pipeline.go
  # derives the slot name from the pipeline ID, not the pod) and duplicates published
  # messages. Do not scale this up until per-pipeline ownership (KV lease / leader
  # election) exists.
  replicas: 1
  # Recreate, not RollingUpdate: a rollout must never run two producers at once,
  # or the new pod fails on the slot still held by the old one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pipeline
  template:
    metadata:
      labels:
        app: pipeline
    spec:
      containers:
        - name: pipeline
          image: cdc-data-pipeline:latest
          command: ["/app/worker"]
          env:
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: HEALTH_PORT
              value: "8081"
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: pipeline
# No HorizontalPodAutoscaler: see the replicas comment above. Autoscaling the
# worker produces replication-slot collisions and duplicate CDC events.
